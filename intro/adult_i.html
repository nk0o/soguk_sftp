<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포브 공식몰 점검 안내</title>
  <style>
    body {
      margin: 0;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f8f8f8;
      color: #111;
    }

    .wrap {
      max-width: 400px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
    }

    .logo {
      margin-bottom: 36px;
    }

    .logo img {
      width: 140px;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .time {
      font-size: 15px;
      font-weight: 600;
      color: #e53935;
      margin-bottom: 24px;
    }

    .desc {
      font-size: 15px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .box {
      background: #fff;
      padding: 28px 20px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      margin-bottom: 28px;
    }

    .box p {
      font-size: 14px;
      color: #444;
      margin-bottom: 18px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 0;
      margin-bottom: 12px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 15px;
    }

    .btn-naver {
      background: #03C75A;
      color: #fff;
    }

    .btn-coupang {
      background: #111;
      color: #fff;
    }

    .notice {
      margin-top: 30px;
      font-size: 15px;
      color: #888;
      line-height: 1.6;
    }

    .footer {
      margin-top: 50px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="logo">
      <!-- 포브 로고 -->
      <img src="https://forbmaster.cafe24.com/web/img/img-logo.png?v=1" alt="FORB">
    </div>

    <div class="title">
      포브 공식몰 서버 점검 안내
    </div>

    <!-- ✅ 점검 시간 -->
    <div class="time">
      점검 시간 : 4월 4일(토) 00:00 ~ 24:00
    </div>

    <div class="desc">
      더 안정적인 서비스 제공을 위해 시스템 점검을 진행하고 있습니다.<br />
      이용에 불편을 드려 죄송합니다.<br /><br />
      급하게 필요하신 고객님을 위해<br />
      <strong>포브 공식 판매처</strong>를 안내드립니다.
    </div>

    <div class="box">
      <p>아래 공식 판매처에서 동일한 상품을 구매하실 수 있습니다.</p>

      <a class="btn btn-naver"
        href="https://brand.naver.com/forb?utm_source=servercheck&utm_medium=notice&utm_campaign=official_seller"        >
        포브 공식 네이버스토어 바로가기
      </a>

      <a class="btn btn-coupang"
        href="https://shop.coupang.com/dongin01?utm_source=servercheck&utm_medium=notice&utm_campaign=official_seller"        >
        포브 공식 쿠팡스토어 바로가기
      </a>
    </div>

    <strong class="notice">
      점검 종료 후, <br>공식몰에서만 제공되는 단독 혜택도 꼭 확인해보세요!
    </strong>

    <div class="footer">
      © FORB. All rights reserved.
    </div>

  </div>

</body>

</html>
