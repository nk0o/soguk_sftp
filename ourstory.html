<script>
document.addEventListener('DOMContentLoaded', () => {
  const line = document.querySelector('#svg-line');
  const sticky = document.querySelector('.ani-svg__container');
  const area = document.querySelector('.ani-svg');

  const lineLength = line.getTotalLength();
  line.style.strokeDasharray = lineLength;
  line.style.strokeDashoffset = lineLength;

  window.addEventListener('scroll', () => {
    const scrollTop = window.pageYOffset;

    const start = area.offsetTop;
    const end =
      area.offsetTop +
      area.offsetHeight -
      sticky.offsetHeight;

    let progress = (scrollTop - start) / (end - start);
    progress = Math.min(Math.max(progress, 0), 1);

    line.style.strokeDashoffset =
      Math.max(lineLength * (1 - progress), 0);

  });
});
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const section = document.querySelector('.h-scroll');
  const sticky = section.querySelector('.h-scroll__sticky');
  const track = section.querySelector('.h-scroll__track');

  window.addEventListener('scroll', () => {
    const scrollTop = window.pageYOffset;

    const start = section.offsetTop;
    const end =
      section.offsetTop +
      section.offsetHeight -
      sticky.offsetHeight;

    let progress = (scrollTop - start) / (end - start);
    progress = Math.min(Math.max(progress, 0), 1);

    const maxTranslate =
      track.scrollWidth - window.innerWidth;

    track.style.transform =
      `translateX(${-maxTranslate * progress}px)`;
  });
});
</script>
